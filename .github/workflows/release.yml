name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      IMAGE_REF: hermes-agent-local:v2026.7.20-public
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Install release tools
        run: >-
          python -m pip install --disable-pip-version-check
          -r build/research-requirements.txt
          pytest pyyaml ruff==0.15.22

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          test "${RELEASE_TAG}" = "v$(cat VERSION)"
          python scripts/validate-publication-metadata.py

      - name: Seed inert configuration
        run: cp .env.example .env

      - name: Run source checks
        run: make check

      - name: Build runtime image
        run: docker compose -f docker-compose.research.yml build hermes

      - name: Prove plugin-only Hermes integration
        run: bash scripts/plugin-only-test.sh --skip-build

      - name: Prepare release artifact directories
        run: mkdir -p dist/security

      - name: Scan repository for committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          hide-progress: true

      - name: Record fixable vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.72.0
          image-ref: ${{ env.IMAGE_REF }}
          format: json
          output: dist/security/fixable-vulnerabilities.json
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.72.0
          image-ref: ${{ env.IMAGE_REF }}
          format: cyclonedx
          output: dist/security/hermes-research-pack.cdx.json
          exit-code: "0"

      - name: Build and verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          REQUIRE_CLEAN_RELEASE=1 ./hermes-research release-bundle
          ./hermes-research verify-release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 2 -type f \( -name '*.zip' -o -name '*.sha256' -o -name '*.json' \) -print)
          test "${#assets[@]}" -gt 0
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Hermes Research Pack ${RELEASE_TAG}"
          fi
