name: Feature proposal
description: Propose a scoped improvement with a clear research or operational use case.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user or research problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result and the artifacts that should change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or precedent
      description: Link to standards, papers, Hermes APIs, or comparable implementations where relevant.
  - type: textarea
    id: risks
    attributes:
      label: Risks and compatibility
      description: Note privacy, licensing, reproducibility, migration, or backward-compatibility concerns.
