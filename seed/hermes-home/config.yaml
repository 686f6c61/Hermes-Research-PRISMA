toolsets:
- hermes-cli
agent:
  max_turns: 80
  gateway_timeout: 5400
  restart_drain_timeout: 120
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 1800
  verbose: false
  reasoning_effort: high
terminal:
  backend: local
  modal_mode: auto
  cwd: /workspace
  timeout: 180
  env_passthrough: []
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
